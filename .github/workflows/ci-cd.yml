name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + Cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: red_alimentos
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: psql -h localhost -U admin -d red_alimentos -f db/init.sql
        working-directory: backend
        env:
          PGPASSWORD: admin
      - run: npm run test:ci
        working-directory: backend
        env:
          JWT_SECRET: ci-secret
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASSWORD: admin
          DB_NAME: red_alimentos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/

  sonarqube:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descargar coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
      - name: Verificar lcov.info
        run: |
          ls -la backend/coverage/ || echo "No existe"
          cat backend/coverage/lcov.info | head -20 || echo "Sin lcov"
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    name: Escaneo OWASP ZAP
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Iniciar servidor
        run: |
          cd backend
          nohup node dist/server.js > server.log 2>&1 &
          sleep 15
        env:
          JWT_SECRET: ci-secret
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASSWORD: admin
          DB_NAME: red_alimentos
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false