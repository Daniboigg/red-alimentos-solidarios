name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + Cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: red_alimentos
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: psql -h localhost -U admin -d red_alimentos -f db/init.sql
        working-directory: backend
        env:
          PGPASSWORD: admin
      - run: npm run test:ci
        working-directory: backend
        env:
          JWT_SECRET: ci-secret
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASSWORD: admin
          DB_NAME: red_alimentos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/

  sonarqube:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descargar coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
      - name: Verificar token
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "❌ SONAR_TOKEN vacío"
            exit 1
          else
            echo "✅ SONAR_TOKEN presente (longitud: ${#SONAR_TOKEN})"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=Daniboigg_red-alimentos-solidarios
            -Dsonar.organization=daniboigg
            -Dsonar.sources=backend/src
            -Dsonar.tests=backend/tests
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            -Dsonar.coverage.exclusions=backend/tests/**,backend/src/server.ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts
            -Dsonar.sourceEncoding=UTF-8