services:
  db:
    image: postgres:16
    container_name: red_alimentos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: red_alimentos
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d red_alimentos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: